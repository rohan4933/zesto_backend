server.port=5000
spring.application.name=zesto-backend

# Primary Database: H2 Relational SQL Database
# Uses in-memory database with DB_CLOSE_DELAY=-1 to ensure zero OneDrive file-locking conflicts
spring.datasource.url=jdbc:h2:mem:zestodb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=Rohan@New2026!
# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Database Console (View tables & run SQL queries at http://localhost:5000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

logging.level.org.springframework.web=INFO
logging.level.com.zesto.app=INFO
